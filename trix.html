/* V2 : les cartes sont visibles AVANT le choix du contrat. */
.predeal-hand{margin:0 0 30px;padding:25px 22px 27px;background:#203a37;border:1px solid #659682;border-radius:16px}

.select-hand .playing-card{width:75px;height:111px}
/* Centre du tapis : cartes sur 2 lignes, avec couleurs agrandies et noms visibles. */
.board-players{min-height:405px}
.table-cards{display:grid;grid-template-columns:repeat(2, minmax(82px,96px));gap:10px 16px;justify-content:center;align-content:center;min-width:0;min-height:260px}

.table-card-wrap .table-suit-label.is-red{background:#ffe3e1;color:#a62838}
.table-placeholder{grid-column:1 / -1}
/* La règle générique de légende ne doit pas décolorer les symboles DANS les cartes. */
.table-card-wrap .playing-card .card-suit,
.table-card-wrap .playing-card .card-corner{max-width:none;overflow:visible;white-space:normal}
.table-card-wrap .playing-card.red .card-suit,
.table-card-wrap .playing-card.red .card-corner{color:#bf283e}
.table-card-wrap .playing-card.black .card-suit,
.table-card-wrap .playing-card.black .card-corner{color:#182e33}
.table-card-wrap .playing-card:disabled{opacity:1;filter:none}
/* Les piles du Trix représentent les cartes et leurs couleurs, et non des cases ambiguës. */

.trix-slot{display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center;height:63px;font-weight:800}
.trix-slot .mini-rank{font-family:Outfit,Arial,sans-serif;font-size:14px;line-height:1.1}
.trix-slot .mini-suit{font-family:Georgia,serif;font-size:20px;line-height:1}
.trix-slot.played{background:#fdfbf3;color:#172d33}
.trix-slot.played.red{color:#ba283b}
.trix-slot:not(.played){opacity:.48}

/* Bilan de fin de manche : répartition + huit plis détaillés. */
.tricks-recap{margin:24px 0 28px;background:#e9efe6;border-radius:16px;padding:25px;color:#253a39}
.tricks-recap-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:19px}

.trick-count-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:17px}
.trick-count-tile{background:#f9fbf6;border:1px solid #d9e4db;border-radius:11px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.trick-count-tile .trick-count-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.trick-detail{background:#fdfcf8;border:1px solid #d3ddd1;border-radius:13px;padding:15px}
.trick-detail-head{display:flex;align-items:center;gap:11px}
.trick-number{display:flex;justify-content:center;align-items:center;flex:none;width:34px;height:34px;border-radius:9px;background:#d8e7d8;color:#2c5e4c;font-size:12px;font-weight:900}
.trick-winner{display:flex;flex-direction:column;min-width:0;gap:2px;flex:1}
.trick-winner>span{font-size:10px;color:#688076}
.trick-winner strong{font-size:14px;overflow-wrap:anywhere}
.trick-points{flex:none;display:flex;align-items:flex-end;flex-direction:column;font-size:15px;font-weight:900;color:#9c3e46;white-space:nowrap}
.trick-points.zero{color:#537368}
.trick-points small{font-size:9px;color:#536d60}
.trick-played-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 11px}
.trick-play{border:1px solid #e2e6db;border-radius:9px;background:#f1f5ed;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:9px 5px;min-width:0}
.trick-play.win{border-color:#85b591;background:#e4f2e2}
.played-by{font-size:10px;font-weight:700;line-height:1.2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.captured-card{display:flex;align-items:center;justify-content:center;gap:3px;min-width:49px;height:42px;border:1px solid #dcddd5;border-radius:6px;background:#fff;color:#1d3137;box-shadow:0 2px 6px #1b312b12}

.captured-card strong{font-size:16px;line-height:1}
.captured-card span{font:24px/1 Georgia,serif}
.played-winner{font-size:9px;color:#326d52;font-weight:900;line-height:1.2}
.trick-breakdown{display:flex;gap:5px;flex-wrap:wrap}
.trick-breakdown>span{background:#ecf0e7;border-radius:6px;color:#52665a;padding:5px 7px;font-size:10px;font-weight:700}
.trix-arrival-list{display:grid;gap:8px}
.trix-arrival-row{display:flex;align-items:center;gap:12px;border-radius:9px;background:#fff;padding:12px}
.trix-arrival-row strong{flex:1;min-width:0;overflow-wrap:anywhere}
@media(max-width:700px){
.tricks-recap{padding:14px 10px;margin:18px 0}

function botContract(g){
 const available=availableContracts(g);
 const hand=g.hands[g.owner]; // Seules les cartes de l'IA chef sont consultées.
 // Estimation du risque à partir de la main déjà distribuée, sans voir les autres.
 const highCards=hand.filter(c=>['K','A','10'].includes(c.slice(1))).length;
 const queens=hand.filter(c=>c.slice(1)==='Q').length;
 const hearts=hand.filter(c=>c[0]==='H').length;
 const hasKing=hand.includes('HK');
 const jacks=hand.filter(c=>c.slice(1)==='J').length;
 const nearJacks=hand.filter(c=>['10','Q'].includes(c.slice(1))).length;
 const estimate={
   king: (hasKing?70:0)+highCards*3,
   queens:queens*26+highCards*2,
   hearts:hearts*9+highCards*2,
   tricks:highCards*10,
   last:highCards*7,
   general:(hasKing?80:0)+queens*28+hearts*9+highCards*11,
   trix:40-jacks*10-nearJacks*3
 };
 return [...available].sort((a,b)=>estimate[a]-estimate[b] || CONTRACTS.indexOf(a)-CONTRACTS.indexOf(b))[0];
}
function botCard(g,seat){
 const hand=g.hands[seat];
 const legal=g.contract==='trix'?legalTrixCards(hand,g.piles):legalTrickCards(hand,g.trick,g.contract,g.heartsBroken);
 if(!legal.length)return null;
 if(g.contract==='trix'){
   // Favorise la progression et l'ouverture de couleurs bloquées dans sa main.
   return [...legal].sort((a,b)=>{
     const quality=c=>{
       const same=hand.filter(x=>x[0]===c[0]).length;
       const rank=RANKS.indexOf(c.slice(1));
       return (c.slice(1)==='J'?1:0)+same*.4+Math.abs(rank-4)*.15;
     };
     return quality(b)-quality(a);
   })[0];
 }
 const trick=g.trick;
 const suit=trick.length?trick[0].card[0]:null;
 const highest=trick.filter(t=>t.card[0]===suit).reduce((v,t)=>Math.max(v,TRICK_RANKS.indexOf(t.card.slice(1))),-1);
 const last=hand.length===1;
 const riskSuit=(c)=>{
   let points=0;
   if(['king','general'].includes(g.contract)&&c==='HK')points+=80;
   if(['queens','general'].includes(g.contract)&&c.slice(1)==='Q')points+=30;
   if(['hearts','general'].includes(g.contract)&&c[0]==='H')points+=10;
   return points;
 };
 function value(card){
   const rank=TRICK_RANKS.indexOf(card.slice(1));
   const ownPenalty=riskSuit(card);
   const onTable=trick.reduce((sum,t)=>sum+riskSuit(t.card),0);
   const winsNow=!trick.length|| (card[0]===suit && rank>highest);
   const trickPenalty=['tricks','general'].includes(g.contract)?10:0;
   const lastPenalty=last?40:0;
   const penalty=onTable+ownPenalty+trickPenalty+lastPenalty;
   // Prend en compte les cartes connues sur la table seulement : pas de triche avec les mains adverses.
   if(trick.length===3)return (winsNow?penalty*6:0)+(winsNow?rank*.75:-rank*.5) + (winsNow?ownPenalty*2:0);
   if(trick.length){
     return (winsNow?penalty*2+rank*1.1:-rank*.85) + (winsNow?ownPenalty:0);
   }
   // À l'entame : perdre un pli risqué est préférable, mais défausser un gros rang peut aider.
   return rank*1.6 +ownPenalty*.75 + (card[0]==='H'&&['hearts','general','king'].includes(g.contract)?8:0) + (last?rank*2:0);
 }
 return [...legal].sort((a,b)=>value(a)-value(b))[0];
}

function applyAction(seat, action, source){
 if(!game || !action || typeof action!=='object')return;
 try{
  if(action.kind==='addbot'){
    if(seat!==0||game.phase!=='lobby')throw Error('Les IA s’ajoutent depuis le salon par l’hôte.');
    const target=Number(action.seat);
    if(![1,2,3].includes(target)||game.seats[target]?.connected)throw Error('Cette place est déjà occupée.');
    if(game.seats[target]&&!game.seats[target].bot){
      for(const [c,s] of links)if(s===target){links.delete(c);try{c.send({type:'kick'});c.close();}catch{}}
    }
    game.seats[target]=makeBot(target);
  }
  else if(action.kind==='fillbots'){
    if(seat!==0||game.phase!=='lobby')throw Error('Action réservée à l’hôte.');
    for(let i=1;i<4;i++)if(!game.seats[i]?.connected){
      for(const [c,s] of links)if(s===i){links.delete(c);try{c.send({type:'kick'});c.close();}catch{}}
      game.seats[i]=makeBot(i);
    }
  }
  else if(action.kind==='replacebot'){
    if(seat!==0||game.phase==='gameEnd'||game.phase==='lobby')throw Error('Action réservée à l’hôte durant la partie.');
    const target=Number(action.seat);
    if(![1,2,3].includes(target)||!game.seats[target]||game.seats[target].bot||game.seats[target].connected)throw Error('Seul un joueur déconnecté peut être remplacé.');
    game.seats[target]={...makeBot(target),name:game.seats[target].name+' (IA)'};
  }
  else if(action.kind==='beginwithbots'){
    if(seat!==0||game.phase!=='lobby')throw Error('Le remplissage rapide est réservé à l’hôte.');
    for(let i=1;i<4;i++)if(!game.seats[i]?.connected)game.seats[i]=makeBot(i);
    beginGame(game);
  }
  else if(action.kind==='avatar'){
    const avatar=Number(action.avatar);
    if(!Number.isInteger(avatar)||avatar<0||avatar>7)throw Error('Avatar non disponible.');
    if(!game.seats[seat]||game.seats[seat].bot)throw Error('Modification non autorisée.');
    game.seats[seat].avatar=avatar;
  }
  else if(action.kind==='begin'){if(seat!==0)throw Error('Seul l’hôte démarre la partie.');beginGame(game);}
  else if(action.kind==='choose'){if(seat!==game.owner)throw Error('C’est au joueur qui dirige le contrat de choisir.');startContract(game,action.contract);}
  else if(action.kind==='card'){
    playCard(game,seat,action.card);
    if(game.locked){clearTimeout(trickTimer);trickTimer=setTimeout(()=>{if(game?.locked&&game.trick.length===4){try{settleTrick(game);broadcast();}catch(e){setNotice(e.message);}}},2150);}
  }
  else if(action.kind==='next')startNextRound(game);
  else if(action.kind==='rename'){game.seats[seat].name=cap(action.name,20)||`Joueur ${seat+1}`;}
  else if(action.kind==='remove'){
    if(seat!==0||game.phase!=='lobby')throw Error('Action non autorisée.');
    const target=Number(action.seat);
    if(target<1||target>3||!game.seats[target])throw Error('Joueur introuvable.');
    for(const [c,s] of links)if(s===target){links.delete(c);try{c.send({type:'kick'});c.close();}catch{}}
    game.seats[target]=null;
  }
  else if(action.kind==='reset'){
    if(seat!==0||game.phase!=='gameEnd')throw Error('Action non autorisée.');
    const seats=game.seats;game=initialGame(seats[0].name,game.mode,seats[0].token);game.seats=seats;
    for(let i=1;i<4;i++)if(!seats[i]?.connected)game.seats[i]=null;
  }
  else throw Error('Action inconnue.');
  broadcast();
 }catch(e){if(source)sendError(source,e.message);else setNotice(e.message);}
}

function renderLobby(v){
 const count=v.seats.filter(s=>s?.connected).length;
 return `${header(v)}<main class="game-main"><section class="room-heading"><div><span class="section-kicker">SALON PRIVÉ</span><h1>La table se prépare<span class="title-period">.</span></h1><p>Ajoutez des IA ou invitez des amis. Démarrez dès que les quatre places sont occupées.</p></div><div class="room-code-box">${localOnly?'<span>MODE HORS LIGNE</span><strong>3 IA</strong><small>Partie sur cet appareil</small>':`<span>CODE DU SALON</span><strong>${esc(room)}</strong><button data-action="copy-invite">Copier l’invitation ↗</button>`}</div></section>
 <div class="lobby-layout"><section class="lobby-card"><div class="panel-top"><h2>Les joueurs</h2><span>${count} / 4 présents</span></div><div class="lobby-seats">${v.seats.map((s,i)=>`<div data-chat-seat="${i}" class="lobby-seat ${s?.connected?'occupied':''}"><div class="avatar ${s?'avatar-portrait':'avatar-placeholder'}">${s?avatarSVG(s.avatar??0):String(i+1)}</div><div><strong>${esc(s?.name||'Place libre')}</strong><small>${i===0?'Hôte':s?.bot?'Adversaire automatique':s?.connected?'Connecté':s?'Déconnecté':'En attente d’un joueur'}</small></div>${host&&i>0&&s?`<button class="remove-seat" data-action="remove" data-seat="${i}">Retirer</button>`:host&&i>0?`<button class="add-ai" data-action="addbot" data-seat="${i}">+ Ajouter une IA</button>`:s?.connected?'<span class="online-word">PRÊT</span>':''}</div>`).join('')}</div>${mySeat>=0&&v.seats[mySeat]&&!v.seats[mySeat].bot?avatarPicker("lobby-avatar-picker"):""}${host?`${count<4?'<button class="solo-btn fill-bots" data-action="fillbots">Compléter avec des IA <span>+</span></button>':''}<button class="outline-btn quick-start" data-action="beginwithbots">Commencer maintenant · compléter par IA</button><button class="primary-btn" data-action="begin" ${count!==4?'disabled':''}>${count===4?'Commencer la partie':'En attente des joueurs…'} <span>→</span></button>`:'<div class="waiting-state"><span class="pulse-circle"></span> L’hôte démarrera la partie quand tout le monde sera connecté.</div>'}</section>
 <aside class="lobby-side"><div class="info-panel"><span class="section-kicker">VOTRE PARTIE</span><h3>${v.mode==='quick'?'Mode rapide':'Mode complet'}</h3><p>${v.mode==='quick'?'7 manches au total, un contrat différent à chaque manche.':'4 royaumes de 7 manches ; chaque joueur choisit les contrats pendant son royaume.'}</p><div class="info-line"><span>Jeu</span><strong>32 cartes · 7 à As</strong></div><div class="info-line"><span>Objectif</span><strong>Le plus petit score</strong></div><div class="info-line"><span>Dernier pli</span><strong>+40 (hors Trix)</strong></div><div class="info-line"><span>Force des cartes</span><strong>As &gt; 10 &gt; Roi</strong></div><div class="info-line"><span>Chef du contrat</span><strong>Son score ×2</strong></div></div>${localOnly?'':`<button class="outline-btn" data-action="copy-invite">Partager le code et le lien</button>`}<p class="lobby-hint">${localOnly?'Vous jouez directement contre les IA, sans connexion Internet.':'L’hôte doit garder cette page ouverte. Avant le lancement, les amis peuvent prendre la place d’une IA, même si la table est pleine.'}</p></aside></div></main>`;
}
function disconnectedControls(v){
 if(!host)return '';
 const disconnected=v.seats.map((s,i)=>({s,i})).filter(({s,i})=>i>0&&s&&!s.bot&&!s.connected);
 if(!disconnected.length)return '';
 return `<div class="disconnected-controls"><strong>Joueur déconnecté</strong> ${disconnected.map(({s,i})=>`<button data-action="replacebot" data-seat="${i}">Remplacer ${esc(s.name)} par une IA</button>`).join('')}</div>`;
}
function renderSelect(v){
 const chooser=v.owner===mySeat;
 const options=availableContracts(v);
 return `${header(v)}<main class="game-main"><div class="match-top"><div><span class="section-kicker">MANCHE ${v.roundNumber+1} / ${v.mode==='quick'?7:28} ${v.mode==='full'?`· ROYAUME ${v.owner+1} / 4`:''}</span><h1>Choisir le contrat<span class="title-period">.</span></h1><p>${chooser?'À vous de choisir les règles de cette manche.':`${esc(playerName(v,v.owner))} choisit le prochain contrat.`}</p></div><span class="selection-owner">Chef de manche ×2 : <strong>${esc(playerName(v,v.owner))}</strong></span></div>
 ${showScores(v,true)}${disconnectedControls(v)}
 <section class="predeal-hand"><div class="predeal-heading"><div><span class="section-kicker">CARTES DÉJÀ DISTRIBUÉES</span><h2>Vos 8 cartes</h2><p>${chooser?'Regardez votre main, puis choisissez le contrat qui vous convient.':'Consultez vos cartes pendant que le chef de manche choisit le contrat.'}</p></div><span class="dealt-tag">✓ Main distribuée</span></div><div class="hand-cards select-hand" aria-label="Vos huit cartes avant le choix du contrat">${v.myHand.map(card=>cardHTML(card,'disabled')).join('')}</div></section>
 <section class="contracts-section"><div class="section-header"><h2>Les contrats disponibles</h2><span>${options.length} restant${options.length>1?'s':''}</span></div><div class="contract-grid">${CONTRACTS.map(c=>`<button class="contract-card ${c==='general'?'featured':''} ${!options.includes(c)?'used':''}" data-action="choose" data-contract="${c}" ${!chooser||!options.includes(c)?'disabled':''}><div class="contract-icon">${SYMBOL[c]}</div><div class="contract-body"><strong>${CONTRACT_LABELS[c]}</strong><small>${DESCRIPTIONS[c]}</small></div><span class="contract-arrow">${options.includes(c)?'↗':'✓'}</span></button>`).join('')}</div></section></main>`;
}
function renderPlaying(v){
 const isTrix=v.contract==='trix',isMyTurn=v.current===mySeat&&!v.locked;
 const relativeSeats=[(Math.max(0,mySeat)+2)%4,(Math.max(0,mySeat)+3)%4,(Math.max(0,mySeat)+1)%4,Math.max(0,mySeat)];
 const playable=isTrix?legalTrixCards(v.myHand,v.piles):legalTrickCards(v.myHand,v.trick,v.contract,v.heartsBroken);
 const ranks=isTrix?RANKS:TRICK_RANKS;
 const sorted=[...v.myHand].sort((a,b)=>SUITS.indexOf(a[0])-SUITS.indexOf(b[0])||ranks.indexOf(a.slice(1))-ranks.indexOf(b.slice(1)));
 const last=v.lastTrick&&Object.keys(v.lastTrick).length&&v.lastTrick.cards?.length?v.lastTrick:null;
 return `${header(v)}<main class="game-main playing-page"><div class="match-top tight"><div><span class="section-kicker">MANCHE ${v.roundNumber+1} / ${v.mode==='quick'?7:28} · ${v.mode==='full'?`ROYAUME ${v.owner+1} · `:''}CONTRAT EN COURS</span><h1>${esc(CONTRACT_LABELS[v.contract])}<span class="title-period">.</span></h1><p>${DESCRIPTIONS[v.contract]} · As &gt; 10 &gt; Roi pour les plis · Chef ${esc(playerName(v,v.owner))} ×2</p></div><span class="score-tip">Chef ×2 sur ses points</span></div>
 ${showScores(v,true)}${disconnectedControls(v)}
 <section class="felt-board ${isTrix?'board-trix':''}"><div class="felt-pattern"></div><div class="board-topline"><div class="board-label">${isTrix?'PILES DU TRIX':'PLI EN COURS'}${!isTrix&&['king','hearts','general'].includes(v.contract)?`<span class="hearts-status ${v.heartsBroken?'released':'blocked'}">♥ ${v.heartsBroken?'Cœurs libérés':'Cœurs bloqués'}</span>`:''}</div><div class="turn-status ${isMyTurn?'your-turn':''}">${v.locked?'Calcul du pli…':isMyTurn?'À vous de jouer':`${v.seats[v.current]?.bot?'L’IA réfléchit : ':'Tour de '}${esc(playerName(v,v.current))}`}</div></div>
 ${isTrix?`<div class="trix-player-rail">${relativeSeats.map(seat=>`<div data-chat-seat="${seat}" class="trix-player-box ${v.current===seat?'is-turn':''}"><span class="score-portrait">${avatarSVG(v.seats[seat]?.avatar??0)}</span><div><div class="rail-name">${esc(playerName(v,seat))}${v.seats[seat]?.bot?' · IA':''}</div><div class="rail-count">${v.counts[seat]} cartes</div></div></div>`).join('')}</div><div class="trix-piles">${SUITS.map(suit=>`<div class="trix-suit-row"><span class="trix-suit-name ${suit==='H'||suit==='D'?'red':''}">${SUIT_GLYPHS[suit]}</span><div class="trix-slots">${RANKS.map(r=>`<div class="trix-slot ${(v.piles[suit]||[]).includes(r)?'played':''} ${v.lastAction?.card===suit+r?'just-placed':''} ${suit==='H'||suit==='D'?'red':''}" aria-label="${r} de ${SUIT_LABELS[suit]} ${(v.piles[suit]||[]).includes(r)?'posé':'à poser'}"><span class="mini-rank">${r}</span><span class="mini-suit">${SUIT_GLYPHS[suit]}</span></div>`).join('')}</div></div>`).join('')}</div><div class="trix-finish">${v.finishes.length?`Arrivées : ${v.finishes.map((seat,i)=>`${i+1}. ${esc(playerName(v,seat))}`).join(' · ')}`:'Posez d’abord les valets puis complétez les suites.'}</div>`:
 `<div class="board-players">${relativeSeats.map((seat,j)=>`<div data-chat-seat="${seat}" class="board-seat bseat-${j} ${v.current===seat?'active-seat':''}"><div class="board-avatar ${v.current===seat?'active':''}">${avatarSVG(v.seats[seat]?.avatar??0)}</div><small>${esc(playerName(v,seat))}${seat===mySeat?' · Vous':''}</small><span class="seat-subline">${v.counts[seat]} cartes · <strong>${format(v.roundScores[seat])} pts</strong></span>${seat!==mySeat?`<div class="mini-deck"><i></i><i></i><i></i></div>`:''}${v.current===seat&&!v.locked?'<span class="turn-dot"></span>':''}</div>`).join('')}
 <div class="table-cards">${v.trick.length?v.trick.map(({seat,card})=>`<div class="table-card-wrap seat-pos-${seat} ${v.lastAction?.card===card&&v.lastAction?.type==='card'?'moving':''}"><span class="table-player-label">${esc(playerName(v,seat))}</span>${cardHTML(card,'disabled')}<span class="table-suit-label ${card[0]==='H'||card[0]==='D'?'is-red':''}">${SUIT_GLYPHS[card[0]]} ${SUIT_LABELS[card[0]]}</span></div>`).join(''):'<div class="table-placeholder"><span>TRIX</span><small>Les cartes arrivent ici</small></div>'}</div></div>`}
 
 <div class="game-action-log"><span class="action-pip"></span> ${esc(v.lastAction?.text||'La table vous attend…')}</div>
 ${!isTrix&&last?`<div class="last-result">Dernier pli : <strong>${esc(playerName(v,last.winner))}</strong> · ${format(last.points)} points ${last.isLast?'· BONUS DERNIER PLI':''}</div>`:''}</section>
 <section class="hand-area"><div class="hand-header"><div><span class="section-kicker">VOTRE MAIN</span><h2>${v.myHand.length} carte${v.myHand.length>1?'s':''}</h2></div><div class="hand-directions">${isMyTurn?(playable.length?`${playable.length} carte${playable.length>1?'s':''} jouable${playable.length>1?'s':''}`:'Aucune carte jouable'):'Attendez votre tour'}</div></div>
 <div class="hand-cards" aria-label="Vos cartes">${sorted.map(card=>cardHTML(card,`data-action="card" data-card="${card}" ${!isMyTurn||!playable.includes(card)?'disabled':''}`)).join('')}</div><p class="hand-hint">${isTrix?'Poser un As donne immédiatement un autre tour si vous avez une carte jouable. Les joueurs sans pose possible sont passés.':['king','hearts','general'].includes(v.contract)?(v.heartsBroken?'Les cœurs sont libérés : vous pouvez entamer à cœur. Fournissez toujours la couleur demandée.':'Cœurs bloqués : impossible d’entamer à cœur avant une défausse, sauf si vous ne possédez que des cœurs.'):'Fournissez la couleur demandée si vous la possédez. Il n’y a pas d’atout.'}</p></section>
 <section class="history-strip"><h3>Dernières actions</h3><div class="activity-items">${v.events.length?v.events.slice(0,4).map(e=>`<span>${esc(e.message)}${e.points?` <b>${format(e.points)} pts</b>`:''}</span>`).join(''):'<span>Le tour commence…</span>'}</div></section></main>`;
}
function trickCardMini(card){
 if(!card)return '';
 const suit=card[0], rank=card.slice(1);
 return `<span class="captured-card ${suit==='H'||suit==='D'?'red':'black'}"><strong>${esc(rank)}</strong><span>${SUIT_GLYPHS[suit]}</span></span>`;
}
function roundTrickRecap(v,s){
 if(s.contract==='trix'){
   return `<section class="tricks-recap" aria-label="Classement Trix"><div class="tricks-recap-head"><h2>Ordre d’arrivée du Trix</h2><span>Aucun pli en Trix</span></div><div class="trix-arrival-list">${(s.finishes||[]).map((seat,i)=>`<div class="trix-arrival-row"><span class="trick-number">${i+1}</span><strong>${esc(playerName(v,seat))}</strong><span class="trick-points ${s.scores[seat]<0?'negative':''}">${format(s.scores[seat])} pts ${seat===s.owner?'· Chef ×2':''}</span></div>`).join('')}</div></section>`;
 }
 const tricks=s.tricks||[];
 const counts=[0,0,0,0];
 for(const t of tricks)if(t.winner>=0&&t.winner<4)counts[t.winner]++;
 return `<section class="tricks-recap" aria-label="Récapitulatif des plis remportés"><div class="tricks-recap-head"><div><span class="section-kicker">CARTE PAR CARTE</span><h2>Récapitulatif des ${tricks.length} plis</h2><p>${s.earlyStop?"Le Roi de cœur a été capturé : la manche s’est arrêtée aussitôt.":"Chaque pli indique les 4 cartes jouées, son vainqueur et les points de pénalité."}</p></div><span class="tricks-count-pill">${tricks.length} / 8 plis${s.earlyStop?" · Roi capturé":""}</span></div>
  <div class="trick-count-grid">${counts.map((cnt,seat)=>`<div class="trick-count-tile"><span class="trick-count-name">${esc(playerName(v,seat))}${seat===s.owner?' · Chef ×2':''}</span><strong>${cnt}</strong><small>pli${cnt!==1?'s':''} remporté${cnt!==1?'s':''}</small></div>`).join('')}</div>
  <div class="tricks-list">${tricks.map(t=>{
    const parts=[];
    if(t.details?.hasKing && ['king','general'].includes(s.contract))parts.push('Roi ♥ +80');
    if(t.details?.queens && ['queens','general'].includes(s.contract))parts.push(`${t.details.queens} dame${t.details.queens>1?'s':''} : +${t.details.queens*30} pts (30 par Dame)`);
    if(t.details?.hearts && ['hearts','general'].includes(s.contract))parts.push(`${t.details.hearts} cœur${t.details.hearts>1?'s':''} +${t.details.hearts*10}`);
    if(['tricks','general'].includes(s.contract))parts.push('Pli +10');
    if(t.isLast)parts.push('Bonus séparé du dernier pli : +40 pts');
    if(!parts.length)parts.push('Aucune pénalité sur ce pli');
    return `<article class="trick-detail"><div class="trick-detail-head"><span class="trick-number">${String(t.number).padStart(2,'0')}</span><div class="trick-winner"><span>Pli ${t.number}${t.isLast?' · dernier pli':''}</span><strong>Remporté par ${esc(playerName(v,t.winner))}</strong></div><span class="trick-points ${t.points===0?'zero':''}">${format(t.points)} pts${t.doubled?' <small>×2 chef</small>':''}</span></div>
    <div class="trick-played-cards">${(t.plays||[]).map(p=>`<div class="trick-play ${p.seat===t.winner?'win':''}" title="${esc(playerName(v,p.seat))}"><span class="played-by">${esc(playerName(v,p.seat))}</span>${trickCardMini(p.card)}${p.seat===t.winner?'<span class="played-winner">Gagnant</span>':''}</div>`).join('')}</div><div class="trick-breakdown">${parts.map(part=>`<span>${esc(part)}</span>`).join('')}</div></article>`;
  }).join('')}</div></section>`;
}
function renderRoundEnd(v){
 const s=v.roundSummary;if(!s)return '<p>Manche terminée.</p>';
 const ranking=[0,1,2,3].sort((a,b)=>s.scores[a]-s.scores[b]);
 return `${header(v)}<main class="game-main"><div class="result-header"><span class="section-kicker">FIN DE LA MANCHE ${v.roundNumber+1}</span><div class="result-glyph">${SYMBOL[s.contract]}</div><h1>${esc(s.contractLabel)}<span class="title-period">.</span></h1><p>Les points de cette manche ont été ajoutés au classement général. ${esc(playerName(v,s.owner??v.owner))} (chef de manche) : points ×2.</p></div><section class="results-card"><h2>Points de la manche</h2>${s.contract==='queens'?'<p class="queen-scoring-note">Dames : +30 par Dame capturée. Dernier pli : bonus séparé de +40. Le chef double uniquement ses propres pénalités.</p>':''}${ranking.map((seat,i)=>`<div class="result-row"><span class="result-pos">${String(i+1).padStart(2,'0')}</span><span class="result-name">${esc(playerName(v,seat))}${seat===(s.owner??v.owner)?' <span class="chef-double">Chef ×2</span>':''}</span><strong class="${s.scores[seat]<0?'negative':''}">${format(s.scores[seat])} pts</strong></div>`).join('')}</section>${roundTrickRecap(v,s)}<div class="results-bottom">${showScores(v,true)}${disconnectedControls(v)}<button class="primary-btn next-btn" data-action="next">${v.roundNumber+1===(v.mode==='quick'?7:28)?'Voir le classement final':'Manche suivante'} <span>→</span></button></div></main>`;
}

function renderEnd(v){
 const ranking=[0,1,2,3].sort((a,b)=>v.scores[a]-v.scores[b]);
 return `${header(v)}<main class="game-main"><div class="result-header"><span class="section-kicker">PARTIE TERMINÉE · ${v.mode==='quick'?'7':'28'} MANCHES</span><div class="trophy-outline">★</div><h1>La victoire est à <em>${esc(playerName(v,ranking[0]))}</em><span class="title-period">.</span></h1><p>Le score le plus bas remporte la partie.</p></div><section class="results-card end-card"><h2>Classement final</h2>${ranking.map((seat,i)=>`<div class="result-row ${i===0?'winner':''}"><span class="result-pos">${String(i+1).padStart(2,'0')}</span><span class="result-name">${esc(playerName(v,seat))} ${i===0?'<span class="winner-tag">VAINQUEUR</span>':''}</span><strong>${format(v.scores[seat])} pts</strong></div>`).join('')}</section>${host?'<button class="primary-btn next-btn" data-action="reset">Nouvelle partie avec les mêmes joueurs <span>→</span></button>':'<p class="waiting-state">L’hôte peut relancer une nouvelle partie.</p>'}<div class="history-strip"><h3>Historique des manches</h3>${v.history.map((s,i)=>`<div class="history-row"><span>${i+1}. ${esc(s.contractLabel)}</span><strong>${s.scores.map(format).join(' · ')}</strong></div>`).join('')}</div></main>`;
}
function rulesOverlay(){return `<div class="overlay" data-action="close-rules"><div class="rules-modal" role="dialog" aria-modal="true" aria-label="Règles du jeu"><div class="rules-top"><div><span class="section-kicker">LES RÈGLES</span><h2>Trix, version belote.</h2></div><button class="close-btn" data-action="close-rules">×</button></div><p>4 participants (amis et/ou IA), 32 cartes (7, 8, 9, 10, V, D, R, As). Le joueur qui a le moins de points à la fin gagne. Pas d’atout ; obligation de fournir la couleur aux plis.</p><div class="rules-list">${CONTRACTS.map(c=>`<div><strong><span>${SYMBOL[c]}</span> ${CONTRACT_LABELS[c]}</strong><small>${DESCRIPTIONS[c]}</small></div>`).join('')}</div><div class="rules-note"><strong>Force des cartes</strong> Pour les 6 contrats à plis : As &gt; 10 &gt; Roi &gt; Dame &gt; Valet &gt; 9 &gt; 8 &gt; 7. Dans Trix, l’ordre des suites reste 7, 8, 9, 10, Valet, Dame, Roi, As. <strong>Chef du contrat :</strong> les points qu’il gagne ou reçoit sont multipliés par 2, y compris les points négatifs du Trix. Les autres joueurs gardent leur score normal.</div><div class="rules-note"><strong>Blocage des cœurs</strong> Pour les contrats Roi de cœur, Cœurs et Générale : interdiction de commencer un pli à cœur tant que les cœurs ne sont pas libérés. Ils sont libérés dès qu'un cœur est joué en défausse (impossible de fournir la couleur). Si la main ne contient plus que des cœurs, on peut tout de même entamer à cœur. L'obligation de fournir la couleur s'applique toujours.</div><div class="rules-note"><strong>Règle commune</strong> Le joueur qui remporte le dernier pli effectivement joué reçoit +40 points, dans tous les contrats sauf Trix. En Roi de cœur, la manche s’arrête après le pli qui capture le Roi : ce pli devient le dernier. En « Dernier pli », ces 40 points ne comptent qu’une fois. En Générale, les pénalités de tous les contrats de plis sont cumulées.</div><p class="rules-foot">Trix : poser les valets puis compléter chaque famille du 7 à l’As ; poser un As donne un tour supplémentaire si une autre carte est jouable. Les joueurs sans pose possible sont passés automatiquement. 1er : −100 points, 2e : −50 points. Les deux derniers ne reçoivent aucun point.</p></div></div>`;}

// Chat en temps réel : messages relayés par l’hôte, jamais mélangés aux données du jeu.
const socialRoot=document.getElementById('social-root');
function cleanChat(m){
 if(!m||!Number.isInteger(m.seat)||m.seat<0||m.seat>3||typeof m.text!=='string')return null;
 const t=m.text.trim().slice(0,280);if(!t)return null;
 return {id:String(m.id??''),seat:m.seat,name:String(m.name||'Joueur').slice(0,20),text:t,at:Number(m.at)||Date.now()};
}
function chatTime(ts){return new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
// A separate, short-lived bubble is associated with the player who sent the message.
// It is rendered beside their avatar/name, not over the centre of the cards.
function updateChatBubbles(){
 const now=Date.now();
 document.querySelectorAll('[data-chat-seat]').forEach(anchor=>{
  const seat=Number(anchor.dataset.chatSeat),bubble=social.bubbles.get(seat);
  anchor.querySelector(':scope > .player-chat-bubble')?.remove();
  if(!bubble||bubble.until<=now)return;
  const node=document.createElement('div');
  node.className='player-chat-bubble';
  node.setAttribute('role','status');
  node.title=bubble.text;
  node.textContent=bubble.text;
  anchor.appendChild(node);
 });
}
function showSeatChatBubble(m){
 const seat=m.seat,until=Date.now()+5200;
 social.bubbles.set(seat,{text:m.text,until,id:m.id});
 clearTimeout(chatBubbleTimers.get(seat));
 const id=setTimeout(()=>{
  if(social.bubbles.get(seat)?.id===m.id){
   social.bubbles.delete(seat);
   updateChatBubbles();
  }
  chatBubbleTimers.delete(seat);
 },5200);
 chatBubbleTimers.set(seat,id);
 updateChatBubbles();
}
function receiveChat(raw){
 const m=cleanChat(raw);if(!m)return;
 if(social.messages.some(x=>x.id===m.id&&x.id))return;
 social.messages.push(m);social.messages=social.messages.slice(-60);
 if(m.seat!==mySeat&&!social.open)social.unread=Math.min(99,social.unread+1);
 showSeatChatBubble(m);
 renderSocial();
}
function relayChat(seat,rawText){
 if(!game||localOnly||!game.seats[seat]||game.seats[seat].bot||typeof rawText!=='string')return;
 const t=rawText.trim().slice(0,280);if(!t)return;
 const now=Date.now();if(now-(social.lastChatBySeat.get(seat)||0)<500)return;
 social.lastChatBySeat.set(seat,now);
 const m={id:`${room}-${++social.nextId}`,seat,name:game.seats[seat].name,text:t,at:now};
 receiveChat(m);
 for(const c of links.keys())if(c.open)try{c.send({type:'chat-message',message:m});}catch{}
}
function sendChat(text){
 if(!text||!text.trim())return;
 if(host)relayChat(0,text);
 else if(conn?.open)conn.send({type:'chat',text:text.slice(0,280)});
 else setNotice('Salon déconnecté : message non envoyé.');
}
function voiceRoster(){
 if(!game)return [];
 const res=[];
 if(peer?.id&&game.seats[0]?.connected)res.push({peerId:peer.id,seat:0,name:game.seats[0].name,active:social.voiceOn});
 for(const [c,seat] of links)if(c.open&&game.seats[seat]&&!game.seats[seat].bot)
   res.push({peerId:c.peer,seat,name:game.seats[seat].name,active:!!social.guestVoice.get(c.peer)});
 return res;
}
function broadcastRoster(){
 if(!host||localOnly||!game)return;
 social.roster=voiceRoster();
 for(const c of links.keys())if(c.open)try{c.send({type:'voice-roster',roster:social.roster});}catch{}
 syncVoiceCalls();renderSocial();
}
function notifyVoiceStatus(){
 if(host)broadcastRoster();
 else if(conn?.open)try{conn.send({type:'voice-status',active:social.voiceOn});}catch{}
 renderSocial();
}
function cleanupCall(id){
 const a=social.audios.get(id);if(a){a.pause();a.srcObject=null;a.remove();social.audios.delete(id);}
 social.calls.delete(id);
 renderSocial();
}
function attachVoiceCall(call){
 const id=call.peer;
 const old=social.calls.get(id);
 if(old&&old!==call){try{old.close();}catch{}}
 social.calls.set(id,call);
 call.on('stream',stream=>{
   let el=social.audios.get(id);
   if(!el){el=document.createElement('audio');el.autoplay=true;el.playsInline=true;el.setAttribute('aria-hidden','true');document.body.appendChild(el);social.audios.set(id,el);}
   el.srcObject=stream;
   el.play().catch(()=>{setNotice('Audio distant bloqué : appuie sur le bouton Vocal pour autoriser le son.');});
   renderSocial();
 });
 call.on('close',()=>{if(social.calls.get(id)===call)cleanupCall(id);});
 call.on('error',()=>{if(social.calls.get(id)===call)cleanupCall(id);});
}
function receiveVoiceCall(call){
 if(!social.voiceOn||!social.stream||localOnly||!social.roster.some(r=>r.peerId===call.peer)){
   try{call.close();}catch{}return;
 }
 attachVoiceCall(call);
 try{call.answer(social.stream);}catch{try{call.close();}catch{}}
}
function syncVoiceCalls(){
 if(!social.voiceOn||!social.stream||!peer?.id)return;
 const target=new Set(social.roster.filter(r=>r.active&&r.peerId!==peer.id).map(r=>r.peerId));
 for(const [id,call] of [...social.calls])if(!target.has(id)){try{call.close();}catch{}cleanupCall(id);}
 for(const id of target){
   // Pour éviter deux appels parallèles, le peer d’identifiant inférieur appelle.
   if(peer.id.localeCompare(id)>=0||social.calls.has(id))continue;
   try{const call=peer.call(id,social.stream);if(call)attachVoiceCall(call);}catch{}
 }
}
async function toggleVoice(){
 if(localOnly||!peer||!(host||conn?.open)){setNotice('Le vocal nécessite un salon connecté avec des amis.');return;}
 if(social.voiceOn){stopVoice();return;}
 if(!navigator.mediaDevices?.getUserMedia){setNotice('Micro indisponible : ouvre le jeu via une adresse HTTPS.');return;}
 try{
   const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
   if(!peer||localOnly){stream.getTracks().forEach(t=>t.stop());return;}
   social.stream=stream;social.voiceOn=true;social.muted=false;
   stream.getAudioTracks().forEach(t=>t.onended=()=>{if(social.voiceOn)stopVoice();});
   notifyVoiceStatus();syncVoiceCalls();
 }catch(e){setNotice(e?.name==='NotAllowedError'?'Accès au micro refusé : autorise le micro dans le navigateur.':'Impossible d’activer le micro : '+(e?.message||'erreur'));}
}
function stopVoice(silent=false){
 const wasOn=social.voiceOn;
 social.voiceOn=false;social.muted=false;
 for(const c of social.calls.values())try{c.close();}catch{}
 social.calls.clear();
 for(const a of social.audios.values()){a.pause();a.srcObject=null;a.remove();}
 social.audios.clear();
 if(social.stream){for(const track of social.stream.getTracks())try{track.stop();}catch{}social.stream=null;}
 if(wasOn&&!silent)notifyVoiceStatus();
 if(!silent)renderSocial();
}
function toggleMute(){
 if(!social.voiceOn||!social.stream)return;
 social.muted=!social.muted;
 for(const t of social.stream.getAudioTracks())t.enabled=!social.muted;
 renderSocial();
}
function renderSocial(scrollToBottom=false){
 const v=displayView(),online=!!v&&!localOnly&&(host?!!peer?.open:!!conn?.open),visible=!!v&&!localOnly;
 if(!visible){socialRoot.innerHTML='';document.body.classList.remove('social-chat-open');return;}
 const oldInput=socialRoot.querySelector('#chat-text'),draft=oldInput?.value||'';
 const inputFocused=document.activeElement===oldInput;
 const list=socialRoot.querySelector('.chat-messages');const oldScroll=list?.scrollTop||0;
 const atBottom=!list||list.scrollHeight-list.scrollTop-list.clientHeight<75;
 document.body.classList.toggle('social-chat-open',social.open);
 const members=v.seats.filter(s=>s&&!s.bot).length;
 const vocalCount=social.roster.filter(r=>r.active).length;
 socialRoot.innerHTML=`<div class="social-toolbar" aria-label="Communication dans le salon">
 <button type="button" data-social="toggle-chat" class="social-tool ${social.open?'is-active':''}" aria-expanded="${social.open}" title="Discussion écrite">◉ <span>Chat${social.unread?` <b class="chat-unread">${social.unread}</b>`:''}</span></button>
 <button type="button" data-social="toggle-voice" class="social-tool ${social.voiceOn?'is-active':''}" aria-pressed="${social.voiceOn}" title="${social.voiceOn?'Quitter le salon vocal':'Activer son micro et rejoindre le vocal'}">${social.voiceOn?'◖))':'◖'} <span>${social.voiceOn?'Vocal actif':'Vocal'}</span></button>
 ${social.voiceOn?`<button type="button" data-social="mute" class="social-tool ${social.muted?'is-muted':''}" aria-pressed="${social.muted}">${social.muted?'Micro coupé':'Couper micro'}</button>`:''}
 </div>
 ${social.open?`<section class="chat-panel" id="trix-chat" aria-label="Discussion du salon"><header class="chat-panel-head"><div><strong>Discussion du salon</strong><small>Historique défilant · 60 derniers messages · ${members} humain${members>1?'s':''} · ${vocalCount} en vocal · ${online?'Connecté':'Connexion interrompue'}</small></div><button type="button" data-social="toggle-chat" aria-label="Fermer la discussion">×</button></header>
 <div class="chat-messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="Messages reçus">${social.messages.length?social.messages.map(m=>`<article class="chat-message ${m.seat===mySeat?'mine':''}"><div><b>${esc(m.name)}</b><time>${chatTime(m.at)}</time></div><p>${esc(m.text)}</p></article>`).join(''):'<p class="chat-empty">Aucun message pour le moment.</p>'}</div>
 <form class="chat-form" id="chat-form"><input id="chat-text" autocomplete="off" maxlength="280" placeholder="Écris à tes amis…" aria-label="Message à envoyer" ${online?'':'disabled'}/><button type="submit" ${online?'':'disabled'}>Envoyer</button></form>
 <div class="voice-hint">${social.voiceOn?'Micro '+(social.muted?'coupé':'ouvert')+' · '+social.calls.size+' connexion(s) vocales':'Le micro est désactivé par défaut. Le vocal exige HTTPS et une autorisation du navigateur.'}</div></section>`:''}`;
 if(social.open){
   const inp=socialRoot.querySelector('#chat-text');if(inp)inp.value=draft;
   if(inputFocused&&inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
   const sc=socialRoot.querySelector('.chat-messages');if(sc)sc.scrollTop=scrollToBottom||atBottom?sc.scrollHeight:oldScroll;
 }
}
socialRoot.addEventListener('click',e=>{
 const b=e.target.closest('[data-social]');if(!b)return;
 audio.ensure();audio.begin();
 if(b.dataset.social==='toggle-chat'||b.dataset.social==='open-chat'){
   if(b.dataset.social==='open-chat')social.open=true;else social.open=!social.open;
   if(social.open){social.unread=0;social.alerts=[];}
   renderSocial();
   if(social.open&&window.innerWidth<1350)requestAnimationFrame(()=>socialRoot.querySelector('#trix-chat')?.scrollIntoView({block:'nearest',behavior:'smooth'}));
 }else if(b.dataset.social==='toggle-voice')toggleVoice();
 else if(b.dataset.social==='mute')toggleMute();
});
socialRoot.addEventListener('submit',e=>{
 if(e.target.id!=='chat-form')return;e.preventDefault();
 const input=socialRoot.querySelector('#chat-text');const value=input?.value||'';if(!value.trim())return;
 if(input)input.value='';sendChat(value);
});

function render(){
 const v=displayView();
 root.innerHTML=(v?(v.phase==='lobby'?renderLobby(v):v.phase==='select'?renderSelect(v):v.phase==='play'?renderPlaying(v):v.phase==='roundEnd'?renderRoundEnd(v):renderEnd(v)):(connecting?`<div class="connect-screen"><div class="brand"><span class="logo-mark">TRIX.</span></div><div class="spin"></div><h1>Connexion au salon ${esc(room)}…</h1><p>La table se prépare.</p><button class="outline-btn" data-action="leave">Retour</button></div>`:renderLanding()))+(status?`<div class="toast" role="status">${esc(status)} <button data-action="dismiss">×</button></div>`:'')+(showRules?rulesOverlay():'');
 renderSocial();
 updateChatBubbles();
}
root.addEventListener('input',e=>{
 if(e.target.id==='player-name'||e.target.id==='join-name')name=e.target.value;
 if(e.target.id==='room-code')roomInput=e.target.value.toUpperCase();
});
root.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 const a=b.dataset.action;
 if(a!=='music'&&a!=='sound'){audio.ensure();audio.begin();}
 if(a==='music'){audio.toggle('music');return;}
 if(a==='sound'){audio.toggle('sound');return;}
 if(a==='avatar'){selectedAvatar=Number(b.dataset.avatar);localStorage.setItem('trix_avatar',String(selectedAvatar));if(displayView()?.phase==='lobby'&&mySeat>=0){action({kind:'avatar',avatar:selectedAvatar});}else{render();}return;}
 if(a==='close-rules'){if(e.target===b||b.classList.contains('close-btn')){showRules=false;render();}return;}
 if(a==='rules'){showRules=true;render();return;}
 if(a==='dismiss'){status='';render();return;}
 if(a==='setmode'){selectedMode=b.dataset.mode;render();return;}
 if(a==='create'){startHosting(false);return;}
 if(a==='solo'){startOffline();return;}
 if(a==='recover'){roomInput=b.dataset.room;startHosting(true);return;}
 if(a==='join'){joinRoom();return;}
 if(a==='leave'){if(game?.phase==='play'||game?.phase==='select'){if(!confirm('Quitter la table ? La partie en cours ne sera plus affichée.'))return;}resetConnections();render();return;}
 if(a==='copy-invite'){copyValue(inviteText());return;}
 if(a==='addbot'){action({kind:'addbot',seat:Number(b.dataset.seat)});return;}
 if(a==='fillbots'){action({kind:'fillbots'});return;}
 if(a==='beginwithbots'){action({kind:'beginwithbots'});return;}
 if(a==='replacebot'){action({kind:'replacebot',seat:Number(b.dataset.seat)});return;}
 if(a==='begin'){action({kind:'begin'});return;}
 if(a==='choose'){action({kind:'choose',contract:b.dataset.contract});return;}
 if(a==='card'){action({kind:'card',card:b.dataset.card});return;}
 if(a==='next'){action({kind:'next'});return;}
 if(a==='reset'){action({kind:'reset'});return;}
 if(a==='remove'){action({kind:'remove',seat:Number(b.dataset.seat)});return;}
});
window.addEventListener('beforeunload',()=>{if(host)persistHost();});
render();

</script>
</body>
